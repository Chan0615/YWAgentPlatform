upstream portal_backend {
    server backend:8000;
}

upstream portal_frontend {
    server frontend:80;
}

# AgenticOps 子应用 (根据实际部署地址修改)
upstream app_cmdb {
    server host.docker.internal:8001;
}

# agent_platform 子应用 (根据实际部署地址修改)
upstream app_agent {
    server host.docker.internal:8002;
}

server {
    listen 80;
    server_name yw.ops.com;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1024;

    # Portal 后端 API
    location /api/ {
        proxy_pass http://portal_backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 子应用: AgenticOps (AgenticOps)
    location /app/cmdb/ {
        proxy_pass http://app_agentic_ops/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

# 子应用: agent_platform (Agent自动化)
location /app/agent/ {
    proxy_pass http://app_agent/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ============================================
# 子应用接入模板
# 使用方法:
# 1. 先在服务器部署子应用代码，例如运行在 10.225.138.183:8088
# 2. 复制一段 location 并替换应用编码和端口
# 3. 在平台“应用管理”里新增应用，访问地址填写 /app/应用编码/
# 示例:
# location /app/opsflow/ {
#     proxy_pass http://10.225.138.183:8088/;
#     proxy_set_header Host $host;
#     proxy_set_header X-Real-IP $remote_addr;
#     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#     proxy_set_header X-Forwarded-Proto $scheme;
# }
# ============================================

    # Portal 前端 (Vue SPA)
    location / {
        proxy_pass http://portal_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # SPA History 模式 fallback
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://portal_frontend;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 健康检查
    location /health {
        proxy_pass http://portal_backend/health;
    }
}

