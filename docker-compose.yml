version: '3.8'

services:
  # Portal 后端 API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: YWAgentPlatform-Backend
    restart: always
    env_file:
      - ./backend/.env
    environment:
      # 容器内通过宿主机 IP 连接已部署的 MySQL/Redis
      # 如果 MySQL/Redis 也在同一台机器的 Docker 里，用 host.docker.internal 或宿主机 IP
      - DB_HOST=${DB_HOST:-10.225.138.183}
      - REDIS_HOST=${REDIS_HOST:-10.225.138.183}
      - DEBUG=false
    ports:
      - "8010:8000"
    networks:
      - YWAgentPlatform-net

  # Portal 前端
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: YWAgentPlatform-Frontend
    restart: always
    networks:
      - YWAgentPlatform-net

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: YWAgentPlatform-Nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - backend
      - frontend
    networks:
      - YWAgentPlatform-net

networks:
  YWAgentPlatform-net:
    driver: bridge
